<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sets [data-theme] before first paint (avoids a flash of the wrong theme) and keeps it
      in sync if the OS-level preference changes while the page is open. HeroUI's own theme
      tokens (and this app's --brand-blue/--secondary-text in index.css) key off this exact
      attribute, so setting it is enough to switch the whole app's palette.
    -->
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.dataset.theme = mq.matches ? "dark" : "light";
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060607" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Meeting Scheduler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
