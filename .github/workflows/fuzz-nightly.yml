name: Nightly property-test fuzz run

# Runs only the property-based ("fuzz") test files, at a much higher iteration count than
# every-PR CI (see ci.yml, which runs the full suite at FC_NUM_RUNS=1000). This finds
# rarer edge cases without slowing down normal PRs. fast-check reports a reproducible
# seed on any failure (see the file header comment in src/test/arbitraries.ts) — copy it
# into a local `FC_NUM_RUNS=50000 npm run test:property` run to reproduce.
#
# Manual only (no schedule): trigger this from the Actions tab before shipping a change
# to scheduling/timezone code, rather than running it unattended every night.
on:
  workflow_dispatch: {}

env:
  FC_NUM_RUNS: "50000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeting-scheduler
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meeting-scheduler/package-lock.json

      - run: npm ci
      - run: npm run test:property
