version: 2
updates:
  - package-ecosystem: npm
    directory: /meeting-scheduler
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # vite, its plugins, and vitest share peer-dependency ranges on vite itself —
      # bumping one without the others produces an unsatisfiable npm ci (see the CI
      # failures on the vite-8 and @vitejs/plugin-react-6 PRs). Group them so
      # Dependabot only proposes versions that are mutually compatible.
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "@tailwindcss/vite"
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
