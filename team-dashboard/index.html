<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets [data-theme] before first paint. Uses the light/dark choice saved by the meeting
         scheduler's footer toggle if there is one, otherwise the OS setting. Keep this script
         identical to the other apps': the CSP in public/_headers allows it by hash. -->
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var stored = localStorage.getItem("theme");
          document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : mq.matches ? "dark" : "light";
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060607" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Team dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
